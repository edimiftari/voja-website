:root{--parchment:#EBEBDF; --ink:#323232; --azure:#A9C2E0; --ginger:#E9631A}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:var(--ink); color:var(--parchment); font-family:"Manrope","Helvetica Neue",Arial,sans-serif; display:flex; flex-direction:column; -webkit-font-smoothing:antialiased}
.wrap{width:min(1240px,100% - 2*clamp(16px,4vw,48px)); margin-inline:auto}

nav{display:flex; gap:clamp(14px,3vw,32px)}
nav a{color:rgba(235,235,223,.7); text-decoration:none; font-size:15px; font-weight:500; transition:color .2s}

.box{display:grid; grid-template-columns:auto 1fr; gap:clamp(28px,6vw,80px); align-items:center}
.egg{width:clamp(130px,20vw,230px); transform-origin:50% 92%; animation:rock 3.2s ease-in-out 1s infinite}
.egg svg{width:100%; height:auto; display:block; overflow:visible; animation:knock 5s ease-out 2s infinite}
.egg .cr{fill:var(--ink)}
.label{font-weight:600; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:rgba(235,235,223,.6)}
h1{font-family:"Outfit","Helvetica Neue",Arial,sans-serif; font-weight:400; font-size:clamp(42px,7.5vw,104px); line-height:.95; letter-spacing:-.035em; margin:14px 0 18px; text-wrap:balance}
h1 em{font-style:normal; color:var(--ginger)}
p{margin:0 0 28px; color:rgba(235,235,223,.75); max-width:40ch; font-size:17px; line-height:1.55}
.btns{display:flex; gap:10px; flex-wrap:wrap}
.btn{font:600 14px/1 "Manrope",Arial,sans-serif; border:1.5px solid var(--ginger); background:var(--ginger); color:#fff; border-radius:999px; padding:13px 20px; text-decoration:none; transition:transform .2s}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:transparent; border-color:currentColor; color:var(--parchment)}
@keyframes rock{0%,37.5%,100%{transform:rotate(0)}7.5%{transform:rotate(-7deg)}15%{transform:rotate(5deg)}22.5%{transform:rotate(-3deg)}30%{transform:rotate(1deg)}}
@keyframes knock{0%,7.8%,9%,15.6%,100%{scale:1; translate:0 0}
  1.8%{scale:1.045 .965; translate:0 0} 3.6%{scale:.975 1.04; translate:0 -4px} 5.4%{scale:1.01 .995; translate:0 0}

@media (max-width:640px){ nav{display:none} .box{grid-template-columns:1fr; justify-items:start} .egg{width:110px} }
